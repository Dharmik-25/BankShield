services:
  backend:
    build: ./backend
    image: bankshield-backend:ci
    ports:
      - "5000:5000"
    volumes:
      - bankshield-data:/app/data
    environment:
      - BANKSHIELD_DB=/app/data/bankshield.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    image: bankshield-frontend:ci
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  bankshield-data:

